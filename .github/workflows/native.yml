name: Native checks

on:
  push:
    branches: [dev, main]
    paths-ignore: ['website/**']
  pull_request:
    branches: [dev, main]
    paths-ignore: ['website/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Select check scope
        id: scope
        run: python tools/ci_scope.py
      - name: Validate source and release tooling
        run: |
          python tools/check_source.py
          python tests/ci_scope_tests.py
          python tests/release_tests.py
          python tests/runtime_build_tests.py
          python tests/installer_tests.py
  native:
    needs: source
    if: ${{ !cancelled() && (needs.source.result != 'success' || needs.source.outputs.runtime == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev libsdl2-ttf-dev
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config sdl2 sdl2_ttf
      - name: Install Python tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r tools/requirements.txt
      - name: Check source inputs
        run: .venv/bin/python tools/check_source.py
      - name: Build the pinned core
        run: .venv/bin/python tools/build_core.py
      - name: Run quiet native checks
        run: .venv/bin/python tools/check.py --work build/ci-check
      - name: Show check summaries on failure
        if: failure()
        run: |
          find build/ci-check -maxdepth 1 -name '*.log' -type f -exec tail -n 60 {} \;
