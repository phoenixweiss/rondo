name: BaseOS compatibility matrix

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/baseos-matrix.yml
      - .github/workflows/baseos-check.yml
      - runtime/baseos-matrix.json
      - runtime/preflight-isolated.sh
      - tools/prepare_baseos_rootfs.py
      - tools/check_h700_runtime.py

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    outputs:
      versions: ${{ steps.inputs.outputs.versions }}
      sha256: ${{ steps.inputs.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/h700-cache
          key: h700-sources-${{ hashFiles('docs/dependencies/*.json', 'runtime/openbios-toolchain.json') }}
      - name: Build one H700 candidate
        run: python tools/build_h700_runtime.py --work build/baseos-candidate
      - name: Collect the candidate and compatibility tests
        id: inputs
        shell: bash
        run: |
          echo "versions=$(jq -c 'keys' runtime/baseos-matrix.json)" >> "$GITHUB_OUTPUT"
          cd build/baseos-candidate
          echo "sha256=$(jq -er .sha256 output/build-result.json)" >> "$GITHUB_OUTPUT"
          tar -czf ../baseos-candidate.tar.gz output source/runtime/build-lock.json \
            source/runtime/preflight-isolated.sh programs/*-tests programs/rumble-fixture.so \
            programs/test-fixtures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseos-candidate
          path: build/baseos-candidate.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  compatibility:
    needs: candidate
    uses: ./.github/workflows/baseos-check.yml
    with:
      versions: ${{ needs.candidate.outputs.versions }}
      sha256: ${{ needs.candidate.outputs.sha256 }}
