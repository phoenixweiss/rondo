name: BaseOS compatibility matrix

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - .github/workflows/baseos-matrix.yml
      - runtime/baseos-matrix.json
      - runtime/preflight-isolated.sh
      - tools/prepare_baseos_rootfs.py
      - tools/check_h700_runtime.py

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    outputs:
      versions: ${{ steps.inputs.outputs.versions }}
      sha256: ${{ steps.inputs.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/h700-cache
          key: h700-sources-${{ hashFiles('docs/dependencies/*.json', 'runtime/openbios-toolchain.json') }}
      - name: Build one H700 candidate
        run: python tools/build_h700_runtime.py --work build/baseos-candidate
      - name: Collect the candidate and compatibility tests
        id: inputs
        shell: bash
        run: |
          echo "versions=$(jq -c 'keys' runtime/baseos-matrix.json)" >> "$GITHUB_OUTPUT"
          cd build/baseos-candidate
          echo "sha256=$(jq -er .sha256 output/build-result.json)" >> "$GITHUB_OUTPUT"
          tar -czf ../baseos-candidate.tar.gz output source/runtime/build-lock.json \
            source/runtime/preflight-isolated.sh programs/*-tests programs/rumble-fixture.so \
            programs/test-fixtures
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseos-candidate
          path: build/baseos-candidate.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  compatibility:
    needs: candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        baseos: ${{ fromJSON(needs.candidate.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: baseos-candidate
          path: build
      - name: Prepare pinned BaseOS userspace
        env:
          BASEOS_VERSION: ${{ matrix.baseos }}
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs squashfs-tools
          mkdir build/baseos-candidate
          tar -xzf build/baseos-candidate.tar.gz -C build/baseos-candidate
          python tools/prepare_baseos_rootfs.py --version "$BASEOS_VERSION" --work build/baseos-rootfs
      - name: Verify the same H700 package on BaseOS
        env:
          BASEOS_VERSION: ${{ matrix.baseos }}
          CANDIDATE_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: |
          python tools/check_h700_runtime.py --build build/baseos-candidate \
            --rootfs build/baseos-rootfs/rootfs --baseos-version "$BASEOS_VERSION" \
            --work build/baseos-check
          jq -e --arg sha "$CANDIDATE_SHA256" '.package_sha256 == $sha' build/baseos-check/summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: baseos-${{ matrix.baseos }}-results
          path: |
            build/baseos-check/baseos-preflight.log
            build/baseos-check/summary.json
          if-no-files-found: ignore
          retention-days: 7
